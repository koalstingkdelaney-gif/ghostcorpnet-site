name: GhostCorp Agent Runtime Tests

on:
  pull_request:
    paths:
      - "integrations/agent_runtime/**"
      - ".github/workflows/agent-runtime-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "integrations/agent_runtime/**"
      - ".github/workflows/agent-runtime-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run runtime unit tests
        run: python -m unittest discover -s integrations/agent_runtime -v

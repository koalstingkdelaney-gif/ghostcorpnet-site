name: Local model smoke tests

on:
  workflow_dispatch:
  push:
    paths:
      - "jarvis/model-fleet/**"
      - ".github/workflows/local-model-smoke.yml"

permissions:
  contents: read

concurrency:
  group: local-model-smoke
  cancel-in-progress: false

jobs:
  ollama-model:
    name: "Ollama smoke test: ${{ matrix.model }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model:
          - qwen3:0.6b
          - qwen3:1.7b
          - qwen3:4b
          - deepseek-r1:1.5b
          - qwen2.5-coder:1.5b
          - phi3.5:latest
    timeout-minutes: 25
    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Download selected model
        env:
          MODEL: ${{ matrix.model }}
        run: ollama pull "$MODEL"

      - name: Run inference smoke test
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          model = os.environ["MODEL"]
          payload = {
              "model": model,
              "messages": [{"role": "user", "content": "Reply with exactly the word READY."}],
              "stream": False,
              "options": {"temperature": 0, "num_predict": 32}
          }
          request = urllib.request.Request(
              "http://127.0.0.1:11434/api/chat",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=240) as response:
              result = json.loads(response.read().decode())
          text = result.get("message", {}).get("content", "").strip()
          if not text:
              raise SystemExit(f"FAIL: {model} returned an empty response")
          print(f"PASS: {model}")
          print(text[:500])
          PY
